name: Daily production health monitor

on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC, diariamente (08:00 no horário de Brasília, UTC-3).
    - cron: '0 11 * * *'

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: https://www.bancodesolucoes.com.br

jobs:
  monitor:
    name: Read-only public 1.0 health contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout monitor contracts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run existing read-only production smoke
        id: smoke
        run: npm run test:production-smoke
      - name: Write operational summary
        if: always()
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo '## Monitor diário de produção 1.0'
            echo "- Resultado: **${SMOKE_OUTCOME}**"
            echo '- Destino: `https://www.bancodesolucoes.com.br/`'
            echo '- Contratos: HTTP/HTTPS, aplicação/404, rotas públicas, versão, canonical, robots, sitemap e console.'
            echo '- Segurança: somente leitura; mutações são bloqueadas antes da rede.'
            echo '- Diagnóstico: o nome do teste e a assertion identificam a rota ou contrato; em falha, consulte o artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failure-only Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-monitor-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
