name: Verify, migrate and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch ou SHA para validar
        required: true
        default: main
        type: string
      run_service_diagnostics:
        description: Executar diagnóstico manual dos serviços
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'deploy-main' || format('production-preflight-{0}', inputs.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRODUCTION_BASE_URL: https://www.bancodesolucoes.com.br

jobs:
  migration-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      requires-local-db: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect database SQL changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "Pull request base/head SHAs are required for migration change detection." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          # Equivalent filters: supabase/migrations/** and supabase/**/*.sql.
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -E '^(supabase/migrations/.*|supabase/.*\.sql)$' <<< "$changed_files" >/dev/null; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
          fi

  local-migration-validation:
    if: github.event_name == 'pull_request' && needs.migration-changes.outputs.requires-local-db == 'true'
    needs: migration-changes
    name: Apply migrations against local Supabase PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Wait for isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          until pg_isready --host localhost --port 5432 --username postgres --dbname postgres; do sleep 1; done
      - name: Apply Sprint 32 and 33 compatible schema fixture
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint32_search_schema.sql
      - name: Apply the pending Sprint 32 migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260723120000_sprint32_advanced_search.sql
      - name: Apply the pending Sprint 33 migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260725120000_sprint33_geographic_search.sql
      - name: Apply the pending Sprint 34 migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260726120000_sprint34_recommendations.sql
      - name: Apply the pending Sprint 35 migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260726130000_sprint35_global_taxonomy.sql
      - name: Apply the Sprint 37 distributed rate limit migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260729120000_sprint37_contact_rate_limit.sql
      - name: Apply the Sprint 39 legal consent migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260729130000_sprint39_legal_consent.sql
      - name: Install Sprint 42 administrative compatibility contract
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint42_admin_compatibility.sql
      - name: Apply the Sprint 42 content reports migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260729140000_sprint42_content_reports.sql
      - name: Verify Sprint 32 indexes and public search RPCs
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if (select count(*) from pg_indexes where schemaname = 'public' and indexname in ('problems_search_document_idx', 'solutions_search_document_idx')) <> 2 then
              raise exception 'Sprint 32 full-text indexes were not created';
            end if;
            if to_regprocedure('public.search_tags_text(text[])') is null then
              raise exception 'search_tags_text(text[]) was not created';
            end if;
            if (select provolatile from pg_proc where oid = 'public.search_tags_text(text[])'::regprocedure) <> 'i' then
              raise exception 'search_tags_text(text[]) is not immutable';
            end if;
            if (select proparallel from pg_proc where oid = 'public.search_tags_text(text[])'::regprocedure) <> 's' then
              raise exception 'search_tags_text(text[]) is not parallel safe';
            end if;
            if not (select indisvalid from pg_index where indexrelid = 'public.problems_search_document_idx'::regclass) then
              raise exception 'problems_search_document_idx is invalid';
            end if;
            if not (select indisvalid from pg_index where indexrelid = 'public.solutions_search_document_idx'::regclass) then
              raise exception 'solutions_search_document_idx is invalid';
            end if;
          end
          $$;
          select count(*) from public.search_problems(p_query => 'drenagem');
          select count(*) from public.search_solutions(p_query => 'drenagem');
          SQL
      - name: Verify Sprint 33 objects and execute geographic RPC scenarios
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint33_geographic_assertions.sql
      - name: Verify Sprint 34 recommendation RPCs
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint34_recommendations_assertions.sql
      - name: Verify Sprint 35 taxonomy, security and compatibility
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint35_taxonomy_assertions.sql
      - name: Verify Sprint 37 atomic rate limiting, RLS and privileges
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint37_contact_rate_limit_assertions.sql
      - name: Verify Sprint 39 legal consent security and behavior
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint39_legal_consent_assertions.sql
      - name: Verify Sprint 42 reports security contract
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint42_content_reports_assertions.sql
      - name: Apply the Sprint 43 content moderation migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260730120000_sprint43_content_moderation.sql
      - name: Verify Sprint 43 content moderation security and behavior
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint43_content_moderation_assertions.sql
      - name: Install the production-compatible pre-Sprint 44 notification contract
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint44_notifications_schema.sql
      - name: Verify the cumulative Sprint 31 notification contract
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint31_notifications_assertions.sql
      - name: Apply the Sprint 44 in-app notifications migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260730130000_sprint44_in_app_notifications.sql
      - name: Verify Sprint 44 notification security and behavior
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint44_notifications_assertions.sql
      - name: Install the isolated Supabase Auth users contract
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -c 'create table if not exists auth.users (id uuid primary key);'
      - name: Install production-compatible cumulative comments contract
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint46_comments_schema.sql
      - name: Apply the Sprint 45 notification Realtime migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260730140000_sprint45_notifications_realtime.sql
      - name: Apply Sprint 46 comment reactions migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260730150000_sprint46_comment_reactions.sql
      - name: Verify Sprint 46 comment reactions
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint46_comment_reactions_assertions.sql
      - name: Apply Sprint 47 reputation migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260803120000_sprint47_reputation_achievements.sql
      - name: Verify Sprint 47 reputation behavior
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint47_reputation_assertions.sql
      - name: Install production-compatible pre-Sprint 48 contributions contract
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint48_contributions_schema.sql
      - name: Apply Sprint 48 public profile migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260803130000_sprint48_public_member_profile.sql
      - name: Verify Sprint 48 public profile privacy and behavior
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint48_public_profile_assertions.sql
      - name: Verify Sprint 45 notification security and behavior
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5432 --username postgres --dbname postgres -v ON_ERROR_STOP=1 -f scripts/fixtures/sprint45_notifications_realtime_assertions.sql

  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm test
      - name: Sprint 26 tests
        run: npm run test:sprint26
      - name: Reconciliation safety tests
        run: npm run test:reconciliation
      - name: Pending migration safety tests
        run: npm run test:pending-migrations
      - name: Sprint 33 geographic search tests
        run: npm run test:sprint33
      - name: Sprint 34 recommendation tests
        run: npm run test:sprint34
      - name: Sprint 35 taxonomy tests
        run: npm run test:sprint35
      - name: Sprint 36 internationalization tests
        run: npm run test:sprint36
      - name: Sprint 37 contact tests
        run: npm run test:sprint37
      - name: Sprint 38 legal pages tests
        run: npm run test:sprint38
      - name: Sprint 39 legal consent tests
        run: npm run test:sprint39
      - name: Sprint 40 performance and Actions tests
        run: npm run test:sprint40
      - name: Sprint 41 route resilience tests
        run: npm run test:sprint41
      - name: Sprint 42 content reports tests
        run: npm run test:sprint42
      - name: Sprint 43 content moderation tests
        run: npm run test:sprint43
      - name: Sprint 44 in-app notification tests
        run: npm run test:sprint44
      - name: Sprint 45 Realtime notification tests
        run: npm run test:sprint45
      - name: Sprint 46 comment reaction tests
        run: npm run test:sprint46
      - name: Sprint 47 reputation tests
        run: npm run test:sprint47
      - name: Sprint 48 public profile tests
        run: npm run test:sprint48
      - name: Sprint 50 release candidate tests
        run: npm run test:sprint50
      - name: Sprint 51 security hardening tests
        run: npm run test:sprint51
      - name: Sprint 52 dependency governance tests
        run: npm run test:sprint52
      - name: Sprint 54 observability contract tests
        run: npm run test:sprint54
      - name: Sprint 55 final production audit contract tests
        run: npm run test:sprint55
      - name: Full dependency audit report
        run: npm run security:audit:report
      - name: Security audit gate
        run: npm run security:audit
      - name: Setup Deno for Edge Function
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.2.12
      - name: Type check Supabase Edge Function
        run: deno check supabase/functions/contact-request/index.ts
      - name: Check patch formatting
        run: git diff --check
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Enforce bundle budget
        run: npm run check:bundle-budget
      - name: Generate SBOM from npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run sbom:generate
      - name: Upload SBOM artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sprint51-sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-dist
          path: dist
          retention-days: 1

  e2e:
    if: github.event_name != 'workflow_dispatch'
    name: Critical browser flows
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run deterministic E2E suite
        run: npm run test:e2e
      - name: Preserve E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  production-preflight:
    if: github.event_name == 'workflow_dispatch'
    name: Validate production gates without deployment
    runs-on: ubuntu-latest
    environment: production-preflight
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Validate pending migrations
        run: npm run test:pending-migrations
      - name: Validate required Supabase secrets
        shell: bash
        run: |
          set +x
          for secret_name in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required secret: ${secret_name}" >&2
              exit 1
            fi
          done
      - name: Link Supabase project
        run: npx --yes supabase@2.39.2 link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Validate contact secret names in Supabase
        shell: bash
        run: |
          set +x
          secrets_file="$(mktemp)"
          errors_file="$(mktemp)"
          trap 'rm -f "$secrets_file" "$errors_file"' EXIT
          # Legacy link/migration gates remain on 2.39.2. Secrets use 2.110.0,
          # whose structured JSON output is validated before names are inspected.
          if ! npm_config_loglevel=error npx --yes supabase@2.110.0 secrets list --output json >"$secrets_file" 2>"$errors_file"; then
            echo "Failed to query Supabase secrets." >&2
            exit 1
          fi
          if ! node --experimental-strip-types scripts/checkSupabaseContactSecrets.ts <"$secrets_file"; then
            exit 1
          fi
      - name: Check migration baseline
        run: npm run check:migration-baseline
      - name: List local and remote migrations
        run: npx --yes supabase@2.39.2 migration list --linked
      - name: Preview database migrations without applying them
        run: npx --yes supabase@2.39.2 db push --dry-run

  service-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.run_service_diagnostics == true
    name: Run manual service diagnostics
    runs-on: ubuntu-latest
    environment: production-preflight
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run service diagnostics
        run: npm run check:database

  migrate-and-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore verified build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pages-dist
          path: dist
      - name: Validate required Supabase secrets
        shell: bash
        run: |
          set +x
          for secret_name in \
            SUPABASE_PROJECT_REF \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required secret: ${secret_name}" >&2
              exit 1
            fi
          done
      - name: Link Supabase project
        run: npx --yes supabase@2.39.2 link --project-ref "$SUPABASE_PROJECT_REF"
      # Legacy recovery is manual; a normal deployment has one baseline gate.
      - name: Check migration baseline
        run: npm run check:migration-baseline
      - name: List local and remote migrations
        run: npx --yes supabase@2.39.2 migration list --linked
      - name: Validate pending migrations
        run: npm run test:pending-migrations
      - name: Apply database migrations after baseline
        run: npx --yes supabase@2.39.2 db push
      - name: Deploy contact Edge Function
        run: npx --yes supabase@2.39.2 functions deploy contact-request --no-verify-jwt
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate-and-health
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Read-only production smoke
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Wait for bounded Pages propagation
        shell: bash
        run: |
          set -euo pipefail
          delays=(5 10 20 30 45)
          for attempt in "${!delays[@]}"; do
            response="$(mktemp)"
            result="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}|%{url_effective}' \
              --connect-timeout 10 --max-time 20 "$PRODUCTION_BASE_URL/" || true)"
            status="${result%%|*}"
            effective_url="${result#*|}"
            if [[ "$status" == "200" ]] && [[ "$effective_url" == "$PRODUCTION_BASE_URL/"* ]] \
              && grep -qi '<html' "$response" && grep -qi '/assets/' "$response"; then
              rm -f "$response"
              echo "GitHub Pages propagado com HTML e referências de assets."
              exit 0
            fi
            rm -f "$response"
            if (( attempt == ${#delays[@]} - 1 )); then
              echo "Propagação não confirmou HTTP 200 e HTML válido após ${#delays[@]} tentativas (último status: $status)." >&2
              exit 1
            fi
            sleep "${delays[$attempt]}"
          done
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run read-only production browser smoke
        run: npm run test:production-smoke
      - name: Preserve production smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
